:root{
  --bg:#07100b;
  --surface:#0f1d14;
  --surface2:#14271b;
  --surface3:#1a3324;
  --line:#274431;
  --line2:#3b5a44;
  --text:#f3f7f2;
  --muted:#a9c0b3;
  --muted2:#7f9b88;
  --green:#00a651;
  --green2:#00d166;
  --gold:#e9c46a;
  --gold2:#c9a13f;
  --danger:#ff6b6b;
  --shadow:0 18px 45px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Sora',system-ui,-apple-system,BlinkMacSystemFont,sans-serif
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

.mono{
  font-family:'IBM Plex Mono',ui-monospace,monospace
}

.ball{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:14px;
  border:1px solid var(--line);
  background:#0c1a11;
  color:#c8d8cc;
  transition:.15s
}

.ball:hover{
  border-color:var(--green);
  transform:translateY(-1px)
}

.ball.on{
  background:linear-gradient(145deg,#00c55f,#008a44);
  color:white;
  border-color:#72efab;
  box-shadow:0 6px 18px rgba(0,166,81,.35)
}

.ball.fav{
  outline:2px solid var(--gold);
  outline-offset:2px
}

.ball.hot{
  position:relative
}

.range{
  accent-color:var(--green);
  width:100%
}

input[type=number],input[type=text],select{
  background:#1A2E22;
  border:2px solid #00A651;
  color:#FFFFFF;
  border-radius:10px;
  padding:10px 12px;
  outline:none;
  font-size:16px;
  font-weight:600
}

input::-moz-placeholder{
  color:#9CA3AF;
  opacity:1;
  font-weight:500
}

input::placeholder{
  color:#9CA3AF;
  opacity:1;
  font-weight:500
}

input:focus,select:focus{
  border-color:#E9C46A;
  box-shadow:0 0 0 3px rgba(233,196,106,.28)
}

.seed-input{
  background:#1A2E22 !important;
  border:2px solid #00A651 !important;
  color:#FFFFFF !important;
  font-size:16px !important;
  font-weight:600 !important
}

.seed-input::-moz-placeholder{
  color:#9CA3AF !important;
  opacity:1
}

.seed-input::placeholder{
  color:#9CA3AF !important;
  opacity:1
}

.seed-input:focus{
  border-color:#E9C46A !important;
  box-shadow:0 0 0 3px rgba(233,196,106,.30) !important
}

.chip{
  border:1px solid var(--line);
  background:#0c1a11;
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  font-weight:650;
  color:#d8e5da
}

.chip.active{
  background:var(--green);
  color:white;
  border-color:var(--green)
}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow)
}

::-webkit-scrollbar{
  height:8px;
  width:8px
}

::-webkit-scrollbar-thumb{
  background:#2e4c39;
  border-radius:99px
}

@media(max-width:640px){
  .ball{
    width:38px;
    height:38px;

  }
