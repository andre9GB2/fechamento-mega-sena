  font-size:14px;

  box-shadow:0 6px 18px rgba(0,166,81,.35)
}

  outline-offset:2px
}

  position:relative
}

  width:100%
}

  outline:none;
  font-size:16px;

}

  opacity:1;

}

  color:#9CA3AF;
  opacity:1;

  box-shadow:0 0 0 3px rgba(233,196,106,.28)
}

  border:2px solid #00A651 !important;
  color:#FFFFFF !important;
  font-size:16px !important;
  font-weight:600 !important
}

.seed-input::-moz-placeholder{
  color:#9CA3AF !important;
  opacity:1
}

.seed-input::placeholder{
  color:#9CA3AF !important;
  opacity:1
}

  border-color:#E9C46A !important;
  box-shadow:0 0 0 3px rgba(233,196,106,.30) !important
}

  font-size:12px;
  font-weight:650;
  color:#d8e5da

}

  background:linear-gradient(115deg,rgba(233,196,106,.20),rgba(0,166,81,.20) 58%,rgba(233,196,106,.10));
  border:1px solid rgba(233,196,106,.55)
}

  background:linear-gradient(135deg,#00a651,#028a44);
  border:2px solid var(--gold);
  color:#fff;
  box-shadow:0 12px 28px rgba(0,0,0,.42),0 0 0 3px rgba(233,196,106,.12);
  animation:coffee-pulse 5s ease-in-out infinite
}

.coffee-float:hover{
  transform:translateY(-1px);
  filter:brightness(1.06)
}

.coffee-float:focus-visible{
  outline:3px solid #fff;
  outline-offset:3px
}

@keyframes coffee-pulse{
  0%,88%,100%{
    transform:scale(1);
    box-shadow:0 12px 28px rgba(0,0,0,.42),0 0 0 3px rgba(233,196,106,.12)
